name: Robot diario

on:
  schedule:
    - cron: "23 9 * * *"   # 9:23 UTC = 6:23 en Argentina (fuera de la hora en punto: GitHub demora menos las corridas)
  workflow_dispatch:        # permite correrlo a mano (desde GitHub o desde la web)
    inputs:
      busqueda_id:
        description: "ID de una búsqueda (vacío = todas)"
        required: false
        default: ""
      sin_email:
        description: "1 = no mandar email"
        required: false
        default: "0"
      prueba_email:
        description: "1 = solo mandar un email de prueba (no busca)"
        required: false
        default: "0"

concurrency:
  group: robot
  cancel-in-progress: false

jobs:
  robot:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
        if: inputs.prueba_email != '1'
      - name: Buscar, guardar y avisar
        run: python run.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GMAIL_USUARIO: ${{ secrets.GMAIL_USUARIO }}
          GMAIL_CLAVE_APP: ${{ secrets.GMAIL_CLAVE_APP }}
          SITIO_URL: ${{ secrets.SITIO_URL }}
          BUSQUEDA_ID: ${{ inputs.busqueda_id }}
          SIN_EMAIL: ${{ inputs.sin_email }}
          PRUEBA_EMAIL: ${{ inputs.prueba_email }}
          EMAIL_WEBHOOK: ${{ secrets.EMAIL_WEBHOOK }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_REMITENTE: ${{ secrets.BREVO_REMITENTE }}
