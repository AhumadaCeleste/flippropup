name: Robot diario

on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC = 8:00 en Argentina
  workflow_dispatch:        # permite correrlo a mano (desde GitHub o desde la web)
    inputs:
      busqueda_id:
        description: "ID de una búsqueda (vacío = todas)"
        required: false
        default: ""
      sin_email:
        description: "1 = no mandar email"
        required: false
        default: "0"

concurrency:
  group: robot
  cancel-in-progress: false

jobs:
  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Buscar, guardar y avisar
        run: python run.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GMAIL_USUARIO: ${{ secrets.GMAIL_USUARIO }}
          GMAIL_CLAVE_APP: ${{ secrets.GMAIL_CLAVE_APP }}
          SITIO_URL: ${{ secrets.SITIO_URL }}
          BUSQUEDA_ID: ${{ inputs.busqueda_id }}
          SIN_EMAIL: ${{ inputs.sin_email }}
